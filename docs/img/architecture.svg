<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 385" width="1090" height="385" role="img" aria-label="Architecture of the project"><rect width="1090" height="385" rx="18" fill="#faf9f5"/><text x="40" y="50" font-size="26" fill="#141413" font-weight="500" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >How the pieces fit together</text><text x="40" y="76" font-size="14" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Two models look at the same smell in two different ways</text><rect x="40" y="120" width="190" height="70" rx="14" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.5"/><text x="135" y="150" font-size="16" fill="#141413" font-weight="600" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Smell word</text><text x="135" y="172" font-size="12" fill="#6b6a63" font-weight="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >typed (typos fixed)</text><line x1="232" y1="155" x2="283" y2="155" stroke="#c96442" stroke-width="2.5" stroke-linecap="round"/><polygon points="290,155 280,149 280,161" fill="#c96442"/><rect x="292" y="120" width="220" height="70" rx="14" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.5"/><text x="402" y="150" font-size="16" fill="#141413" font-weight="600" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Real molecules</text><text x="402" y="172" font-size="12" fill="#6b6a63" font-weight="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >from the dataset</text><line x1="514" y1="140" x2="573" y2="100" stroke="#c96442" stroke-width="2.5" stroke-linecap="round"/><polygon points="580,100 570,94 570,106" fill="#c96442"/><rect x="582" y="60" width="210" height="70" rx="14" fill="#fbeee8" stroke="#c96442" stroke-width="1.5"/><text x="687" y="90" font-size="15" fill="#141413" font-weight="600" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >8 simulated sensors</text><text x="687" y="112" font-size="12" fill="#6b6a63" font-weight="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >noise + humidity + drift</text><line x1="794" y1="95" x2="843" y2="95" stroke="#c96442" stroke-width="2.5" stroke-linecap="round"/><polygon points="850,95 840,89 840,101" fill="#c96442"/><rect x="852" y="60" width="200" height="70" rx="14" fill="#fbeee8" stroke="#c96442" stroke-width="1.5"/><text x="952" y="90" font-size="16" fill="#141413" font-weight="600" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Nose model</text><text x="952" y="112" font-size="12" fill="#6b6a63" font-weight="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >numbers in, words out</text><line x1="514" y1="170" x2="573" y2="215" stroke="#c96442" stroke-width="2.5" stroke-linecap="round"/><polygon points="580,215 570,209 570,221" fill="#c96442"/><rect x="582" y="180" width="210" height="70" rx="14" fill="#eef2e8" stroke="#788c5d" stroke-width="1.5"/><text x="687" y="210" font-size="15" fill="#141413" font-weight="600" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Chemical fingerprint</text><text x="687" y="232" font-size="12" fill="#6b6a63" font-weight="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >2,048 fragment counts</text><line x1="794" y1="215" x2="843" y2="215" stroke="#c96442" stroke-width="2.5" stroke-linecap="round"/><polygon points="850,215 840,209 840,221" fill="#c96442"/><rect x="852" y="180" width="200" height="70" rx="14" fill="#eef2e8" stroke="#788c5d" stroke-width="1.5"/><text x="952" y="210" font-size="16" fill="#141413" font-weight="600" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" >Smell model</text><text x="952" y="232" font-size="12" fill="#6b6a63" font-weight="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >structure in, words out</text><rect x="40" y="285" width="1012" height="70" rx="14" fill="#f0eee6" stroke="#f0eee6" stroke-width="1.5"/><text x="60" y="315" font-size="14" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Then the app compares both answers and shows</text><text x="60" y="337" font-size="14" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >confidence, molecules, sensors and accuracy for the smell you picked.</text><text x="782" y="82" font-size="10" fill="#c96442" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="2">SIMULATED</text></svg>