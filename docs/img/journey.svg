<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 390" width="1090" height="390" role="img" aria-label="The journey of one smell"><rect width="1090" height="390" rx="18" fill="#faf9f5"/><text x="40" y="52" font-size="26" fill="#141413" font-weight="500" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >The journey of one smell</text><text x="40" y="80" font-size="14" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >What happens from the moment you pick a scent to the answers on screen</text><rect x="40" y="110" width="215" height="150" rx="14" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.5"/><circle cx="76" cy="148" r="17" fill="#c96442"/><text x="76" y="154" font-size="16" fill="#fff" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >1</text><text x="60" y="195" font-size="17" fill="#141413" font-weight="600" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >You pick a smell</text><text x="60" y="222" font-size="13" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >e.g. Vanilla, Smoky,</text><text x="60" y="241" font-size="13" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Woody or Citrus</text><line x1="258" y1="185" x2="295" y2="185" stroke="#c96442" stroke-width="2.5" stroke-linecap="round"/><polygon points="302,185 292,179 292,191" fill="#c96442"/><rect x="302" y="110" width="215" height="150" rx="14" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.5"/><circle cx="338" cy="148" r="17" fill="#c96442"/><text x="338" y="154" font-size="16" fill="#fff" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >2</text><text x="322" y="195" font-size="17" fill="#141413" font-weight="600" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >Real molecules</text><text x="322" y="222" font-size="13" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >6 aroma molecules that</text><text x="322" y="241" font-size="13" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >carry that smell</text><line x1="520" y1="185" x2="557" y2="185" stroke="#c96442" stroke-width="2.5" stroke-linecap="round"/><polygon points="564,185 554,179 554,191" fill="#c96442"/><rect x="564" y="110" width="215" height="150" rx="14" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.5"/><circle cx="600" cy="148" r="17" fill="#c96442"/><text x="600" y="154" font-size="16" fill="#fff" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >3</text><text x="584" y="195" font-size="17" fill="#141413" font-weight="600" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >8 virtual sensors</text><text x="584" y="222" font-size="13" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >each reacts a little</text><text x="584" y="241" font-size="13" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >differently (simulated)</text><line x1="782" y1="185" x2="819" y2="185" stroke="#c96442" stroke-width="2.5" stroke-linecap="round"/><polygon points="826,185 816,179 816,191" fill="#c96442"/><rect x="826" y="110" width="215" height="150" rx="14" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.5"/><circle cx="862" cy="148" r="17" fill="#c96442"/><text x="862" y="154" font-size="16" fill="#fff" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >4</text><text x="846" y="195" font-size="17" fill="#141413" font-weight="600" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >Two AIs answer</text><text x="846" y="222" font-size="13" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >one reads the sensors,</text><text x="846" y="241" font-size="13" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >one reads the molecules</text><rect x="40" y="290" width="1010" height="74" rx="14" fill="#f0eee6" stroke="#f0eee6" stroke-width="1.5"/><text x="60" y="322" font-size="14" fill="#c96442" font-weight="700" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >What you see:</text><text x="172" y="322" font-size="14" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >the molecules drawn as structures, the 8 sensor bars,</text><text x="60" y="345" font-size="14" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >the nose's guess, the smell model's words, and the measured accuracy for that smell.</text></svg>