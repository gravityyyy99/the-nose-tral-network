<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 545" width="1090" height="545" role="img" aria-label="Measured accuracy"><rect width="1090" height="545" rx="18" fill="#faf9f5"/><text x="40" y="50" font-size="26" fill="#141413" font-weight="500" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >How accurate is it? (measured, not guessed)</text><text x="40" y="76" font-size="14" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >All numbers come from evaluation.json, produced by evaluate.py on data the models never trained on</text><rect x="40" y="100" width="325" height="110" rx="14" fill="#f0eee6" stroke="#f0eee6" stroke-width="1.5"/><text x="62" y="155" font-size="44" fill="#c96442" font-weight="500" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >0.86</text><text x="62" y="180" font-size="14" fill="#141413" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Smell model, ROC-AUC</text><text x="62" y="198" font-size="12" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >0.50 = guessing, 1.00 = perfect</text><rect x="385" y="100" width="325" height="110" rx="14" fill="#f0eee6" stroke="#f0eee6" stroke-width="1.5"/><text x="407" y="155" font-size="44" fill="#c96442" font-weight="500" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >38%</text><text x="407" y="180" font-size="14" fill="#141413" font-weight="600" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Nose: right word in top 5</text><text x="407" y="198" font-size="12" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >random guessing: 3.6%</text><rect x="730" y="100" width="325" height="110" rx="14" fill="#f0eee6" stroke="#f0eee