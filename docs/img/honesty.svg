<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" role="img" aria-label="Real versus simulated"><rect width="1100" height="430" rx="18" fill="#faf9f5"/><text x="40" y="50" font-size="26" fill="#141413" font-weight="500" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >What is real and what is simulated</text><text x="40" y="76" font-size="14" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Honest labels for every output in the app</text><rect x="40" y="100" width="500" height="300" rx="14" fill="#ffffff" stroke="#788c5d" stroke-width="1.5"/><rect x="60" y="120" width="86" height="24" rx="12" fill="#788c5d"/><text x="103" y="137" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="2">REAL</text><text x="60" y="175" font-size="20" fill="#141413" font-weight="500" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >Real results</text><circle cx="68" cy="201" r="4" fill="#788c5d"/><text x="84" y="205" font-size="12.5" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Smell model trained on the OpenPOM dataset (4,983</text><text x="84" y="221" font-size="12.5" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >molecules)</text><circle cx="68" cy="239" r="4" fill="#788c5d"/><text x="84" y="243" font-size="12.5" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Smell model accuracy on held-out molecules (0.83</text><text x="84" y="259" font-size="12.5" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >ROC-AUC)</text><circle cx="68" cy="277" r="4" fill="#788c5d"/><text x="84" y="281" font-size="12.5" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Nose model trained with scikit-learn on simulated</text><text x="84" y="297" font-size="12.5" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >sniffs</text><circle cx="68" cy="315" r="4" fill="#788c5d"/><text x="84" y="319" font-size="12.5" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Per-word accuracy table (evaluation.json)</text><circle cx="68" cy="353" r="4" fill="#788c5d"/><text x="84" y="357" font-size="12.5" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Spelling correction, molecule drawings, the app itself</text><rect x="560" y="100" width="500" height="300" rx="14" fill="#ffffff" stroke="#c96442" stroke-width="1.5"/><rect x="580" y="120" width="120" height="24" rx="12" fill="#c96442"/><text x="640" y="137" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="2">SIMULATED</text><text x="580" y="175" font-size="20" fill="#141413" font-weight="500" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >Simulated or demo</text><circle cx="588" cy="201" r="4" fill="#c96442"/><text x="604" y="205" font-size="12.5" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >All 8 sensor readings: maths plus random noise, no</text><text x="604" y="221" font-size="12.5" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >hardware</text><circle cx="588" cy="239" r="4" fill="#c96442"/><text x="604" y="243" font-size="12.5" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Nose accuracy numbers: measured on the same simulator</text><text x="604" y="259" font-size="12.5" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >it learned from</text><circle cx="588" cy="277" r="4" fill="#c96442"/><text x="604" y="281" font-size="12.5" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Smell compositions in samples.json: hand-picked, not</text><text x="604" y="297" font-size="12.5" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >measured</text><circle cx="588" cy="315" r="4" fill="#c96442"/><text x="604" y="319" font-size="12.5" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Molecules for a smell word: chosen from dataset labels</text><circle cx="588" cy="353" r="4" fill="#c96442"/><text x="604" y="357" font-size="12.5" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Smell-model panel in the app: final model saw these</text><text x="604" y="373" font-size="12.5" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >molecules</text></svg>