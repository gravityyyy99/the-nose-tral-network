if" >9</text><text x="1012.2222222222222" y="150" font-size="13" fill="#141413" font-weight="600" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >App + docs book</text><text x="1012.2222222222222" y="166" font-size="11" fill="#788c5d" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >done</text><circle cx="1130.0" cy="190" r="17" fill="#faf9f5" stroke="#c96442" stroke-width="3" stroke-dasharray="4 3"/><text x="1130.0" y="195" font-size="14" fill="#c96442" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >10</text><text x="1130.0" y="240" font-size="13" fill="#141413" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Real sensors</text><text x="1130.0" y="256" font-size="11" fill="#c96442" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >next</text><rect x="40" y="270" width="1090" height="66" rx="14" fill="#f0eee6" stroke="#f0eee6" stroke-width="1.5"/><text x="60" y="298" font-size="14" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Next: connect a real gas sensor (for example a BME688 on an ESP32), record real smells,</text><text x="60" y="320" font-size="14" fill="#141413" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >retrain the nose model on real readings and test it honestly on sessions it has never seen.</text></svg>