<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 400" width="1090" height="400" role="img" aria-label="Animated journey of one smell"><rect width="1090" height="400" rx="18" fill="#faf9f5"/><text x="40" y="52" font-size="26" fill="#141413" font-weight="500" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >The journey of one smell, animated</text><text x="40" y="80" font-size="14" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Watch a smell travel from a word, to chemistry, to sensor readings, to an AI guess</text><rect x="40" y="120" width="215" height="170" rx="14" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.5"/><rect x="40" y="120" width="215" height="170" rx="14" fill="none" stroke="#c96442" stroke-width="3.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0005;0.0300;0.2200;0.2495;1.0000" dur="8s" repeatCount="indefinite" /></rect><circle cx="74" cy="152" r="16" fill="#c96442"/><text x="74" y="158" font-size="15" fill="#fff" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >1</text><text x="60" y="205" font-size="17" fill="#141413" font-weight="600" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >You pick a smell</text><text x="60" y="230" font-size="13" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Vanilla, Smoky,</text><text x="60" y="248" font-size="13" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >Woody or Citrus</text><rect x="302" y="120" width="215" height="170" rx="14" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.5"/><rect x="302" y="120" width="215" height="170" rx="14" fill="none" stroke="#c96442" stroke-width="3.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2505;0.2800;0.4700;0.4995;1.0000" dur="8s" repeatCount="indefinite" /></rect><circle cx="336" cy="152" r="16" fill="#c96442"/><text x="336" y="158" font-size="15" fill="#fff" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >2</text><text x="322" y="205" font-size="17" fill="#141413" font-weight="600" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >Real molecules</text><text x="322" y="230" font-size="13" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >6 aroma molecules</text><text x="322" y="248" font-size="13" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >that carry that smell</text><rect x="564" y="120" width="215" height="170" rx="14" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.5"/><rect x="564" y="120" width="215" height="170" rx="14" fill="none" stroke="#c96442" stroke-width="3.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5005;0.5300;0.7200;0.7495;1.0000" dur="8s" repeatCount="indefinite" /></rect><circle cx="598" cy="152" r="16" fill="#c96442"/><text x="598" y="158" font-size="15" fill="#fff" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >3</text><text x="584" y="205" font-size="17" fill="#141413" font-weight="600" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >8 virtual sensors</text><text x="584" y="230" font-size="13" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >each reacts a little</text><text x="584" y="248" font-size="13" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >differently (simulated)</text><rect x="826" y="120" width="215" height="170" rx="14" fill="#ffffff" stroke="#e3e0d4" stroke-width="1.5"/><rect x="826" y="120" width="215" height="170" rx="14" fill="none" stroke="#c96442" stroke-width="3.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7505;0.7800;0.9700;0.9995;1.0000" dur="8s" repeatCount="indefinite" /></rect><circle cx="860" cy="152" r="16" fill="#c96442"/><text x="860" y="158" font-size="15" fill="#fff" font-weight="700" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >4</text><text x="846" y="205" font-size="17" fill="#141413" font-weight="600" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" >Two AIs answer</text><text x="846" y="230" font-size="13" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >one reads sensors,</text><text x="846" y="248" font-size="13" fill="#6b6a63" font-weight="400" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" >one reads molecules</text><text x="190" y="160" font-size="15" fill="#c96442" font-family="Georgia, 'Times New Roman', serif" font-weight="600">Vanilla<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0.0000;0.4000;0.4500;0.9500;1.0000" dur="2s" repeatCount="indefinite" /></text><rect x="236" y="146" width="2" height="16" fill="#c96442"><animate attributeName="opacity" values="1;0;1" keyTimes="0.0000;0.5000;1.0000" dur="1s" repeatCount="indefinite" /></rect><g><polygon points="477.0,158.0 469.5,171.0 454.5,171.0 447.0,158.0 454.5,145.0 469.5,145.0" fill="none" stroke="#788c5d" stroke-width="2.5"/><circle cx="477" cy="158" r="4" fill="#c96442"/><circle cx="454.5" cy="145" r="4" fill="#788c5d"/><animateTransform attributeName="transform" type="rotate" from="0 462 158" to="360 462 158" dur="8s" repeatCount="indefinite"/></g><rect x="699" y="160" width="5" height="10" rx="2" fill="#c96442"><animate